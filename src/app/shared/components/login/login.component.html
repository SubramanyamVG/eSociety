<div class="login-wrapper">
  <form [formGroup]="loginFormGroup" (ngSubmit)="onSubmit()" class="login-form">
    <h2>eSociety Login</h2>

    <div class="form-group">
      <label for="usertype">User Type</label>
      <select formControlName="userType">
        <option *ngFor="let type of userTypes" [value]="type">{{ type }}</option>
      </select>
      <div class="error" *ngIf="submitted && loginFormGroup?.get('userType')?.errors">User Type is required</div>
    </div>

    <div class="form-group">
  <label for="username">Username</label>
  <input id="username" formControlName="username" type="text" placeholder="Enter your username" />
  <div class="error" *ngIf="submitted && loginFormGroup?.get('username')?.errors">Username is required</div>
</div>

<div class="form-group">
  <label for="password">Password</label>
  <input id="password" formControlName="password" type="password" placeholder="Enter your password" />
  <div class="error" *ngIf="submitted && loginFormGroup?.get('password')?.errors">Password is required</div>
</div>

    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

    <button type="submit">Login</button>

    <p class="note">Use your society-provided credentials to sign in.</p>
  </form>
</div>
